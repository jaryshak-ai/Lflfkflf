                      this.x = x;
                      this.y = y;
                      this.z = z;
                  }
              }

              private final AuctionPlugin plugin;
              private final Map<UUID, State> states = new ConcurrentHashMap<>();
              private final Map<UUID, Pending> pending = new ConcurrentHashMap<>();
              private final Map<UUID, Session> sessions = new ConcurrentHashMap<>();

              public AuctionMenu(AuctionPlugin plugin) {
                  this.plugin = plugin;
              }

              // ================= служебное =================

              private void later(int ticks, Runnable r) {
                  plugin.getServer().getScheduler().scheduleDelayedTask(plugin, r, ticks);
              }

              private State state(Player p) {
                  return states.computeIfAbsent(p.getUniqueId(), k -> new State());
              }

              private long bal(Player p) {
                  try {
                      return plugin.economy.getBalance(p.getName());
                  } catch (Exception e) {
                      return 0L;
                  }
              }

              private int clickedId(PlayerFormRespondedEvent e) {
                  if (e.wasClosed()) {
                      return -1;
                  }
                  FormResponse r = e.getResponse();
                  if (r instanceof FormResponseSimple) {
                      return ((FormResponseSimple) r).getClickedButtonId();
                  }
                  return -1;
              }

              /** Показывает форму (если был открыт сундук - сначала закрывает его) и запоминает обработчик ответа. */
              private void show(Player p, FormWindow w, Consumer<PlayerFormRespondedEvent> handler) {
                  final UUID id = p.getUniqueId();
                  Session s = sessions.get(id);
                  int delay = 3;
                  if (s != null) {
                      closeChest(s);
                      delay = 6;
                  }
                  later(delay, () -> {
                      if (!p.isOnline()) {
                          return;
                      }
                      int fid = p.showFormWindow(w);
                      pending.put(id, new Pending(fid, handler));
                  });
              }

              private void reopen(Player p) {
                  later(2, () -> openChest(p));
              }

              private static ElementButton btn(String text, String icon) {
                  if (icon == null || icon.isEmpty()) {
                      return new ElementButton(text);
                  }
                  return new ElementButton(text, new ElementButtonImageData(ElementButtonImageData.IMAGE_DATA_TYPE_PATH, icon));
              }

              private static String nameOf(Lot lot) {
                  Item it = lot.toItem();
                  return RuNames.plain(it) + (it.getCount() > 1 ? " x" + it.getCount() : "");
              }

              // ================= события =================

              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  Pending pd = pending.get(p.getUniqueId());
                  if (pd == null || pd.formId != e.getFormID()) {
                      return;
                  }
                  pending.remove(p.getUniqueId());
                  try {
                      pd.handler.accept(e);
                  } catch (Throwable t) {
                      plugin.getLogger().error("[Auction] ошибка формы", t);
                      p.sendMessage("§cОшибка рынка. Сообщи администратору.");
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  UUID id = e.getPlayer().getUniqueId();
                  states.remove(id);
                  pending.remove(id);
                  sessions.remove(id);
              }

              @EventHandler
              public void onClose(InventoryCloseEvent e) {
                  Session s = sessions.get(e.getPlayer().getUniqueId());
                  if (s != null && s.inv != null && s.inv == e.getInventory()) {
                      cleanup(s);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onTransaction(InventoryTransactionEvent e) {
                  Player p = e.getTransaction().getSource();
                  final Session s = sessions.get(p.getUniqueId());
                  if (s == null || s.inv == null) {
                      return;
                  }
                  boolean ours = false;
                  int slot = -1;
                  for (InventoryAction a : e.getTransaction().getActions()) {
                      if (a instanceof SlotChangeAction) {
                          SlotChangeAction sa = (SlotChangeAction) a;
                          if (sa.getInventory() == s.inv) {
                              ours = true;
                              if (slot < 0) {
                                  slot = sa.getSlot();
                              }
                          }
                      }
                  }
                  if (!ours) {
                      return;
                  }
                  e.setCancelled(true); // из меню нельзя ничего забрать или положить
                  final int clicked = slot;
                  later(1, () -> {
                      handleClick(s, clicked);
                      resync(s);
                  });
              }

              private void resync(Session s) {
                  try {
                      if (sessions.get(s.player.getUniqueId()) == s && s.inv != null && s.player.isOnline()) {
                          s.inv.sendContents(s.player);
                          s.player.getInventory().sendContents(s.player);
                      }
                  } catch (Exception ignored) {
                      // не критично
                  }
              }

              private void handleClick(Session s, int slot) {
                  if (sessions.get(s.player.getUniqueId()) != s || !s.open || slot < 0) {
                      return;
                  }
                  String a = s.actions.get(slot);
                  if (a == null) {
                      return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - s.last < 200) {
                      return;
                  }
                  s.last = now;

                  final Player p = s.player;
                  final State st = state(p);
                  try {
                      if (a.startsWith("lot:")) {
                          long id = Long.parseLong(a.substring(4));
                          if (plugin.findLot(id) == null) {
                              p.sendMessage("§cЛот уже продан или снят");
                              render(s);
                              return;
                          }
                          openLot(p, id); // форма сама закроет сундук
                          return;
                      }
                      switch (a) {
                          case "prev":
                              st.page--;
                              break;
                          case "next":
                              st.page++;
                              break;
                          case "mode":
                              st.mine = !st.mine;
                              st.page = 0;
                              break;
                          case "reset":
                              st.search = "";
                              st.page = 0;
                              break;
                          case "search":
                              openSearch(p);
                              return;
                          case "stats":
                              openStats(p);
                              return;
                          case "back":
                              openMain(p);
                              return;
                          default:
                              return;
                      }
                  } catch (Exception ex) {
                      plugin.getLogger().error("[Auction] клик в меню", ex);
                      p.sendMessage("§cОшибка рынка. Сообщи администратору.");
                  }
                  render(s);
              }

              // ================= сундук =================

              private void openChest(Player p) {
                  if (!p.isOnline()) {
                      return;
                  }
                  UUID id = p.getUniqueId();
                  Session old = sessions.get(id);
                  if (old != null) {
                      boolean alive = old.open && old.inv != null && p.getWindowId(old.inv) >= 0;
                      boolean waiting = !old.open && System.currentTimeMillis() - old.created < 2000;
                      if (alive) {
                          render(old);
                          return;
                      }
                      if (waiting) {
                          return;
                      }
                      cleanup(old); // зависшая сессия - убираем и открываем заново
                  }
                  Level lv = p.getLevel();
                  int x = p.getFloorX();
                  int z = p.getFloorZ();
                  int y = p.getFloorY() + 3;
                  if (y > 250) {
                      y = Math.max(1, p.getFloorY() - 3);
                  }
                  Session s = new Session(p, lv, x, y, z);
                  sessions.put(id, s);
                  try {
                      sendFake(p, lv, x, y, z);
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] подготовка меню (sendFake)", e);
                      sessions.remove(id, s);
                      p.sendMessage("§cОшибка рынка. Сообщи администратору.");
                      return;
                  }
                  // даём клиенту время принять блок сундука, и только потом открываем окно
                  later(10, () -> finishOpen(s));
              }

              private void finishOpen(Session s) {
                  Player p = s.player;
                  if (sessions.get(p.getUniqueId()) != s) {
                      return;
                  }
                  if (!p.isOnline() || p.getLevel() != s.level) {
                      cleanup(s);
                      return;
                  }
                  try {
                      ChestMenu m = new ChestMenu(new Holder(s.x, s.y, s.z));
                      s.inv = m;
                      render(s);
                      int wid = p.addWindow(m);
                      if (wid < 0) {
                          cleanup(s);
                          p.sendMessage("§cНе удалось открыть рынок, попробуй ещё раз.");
                          return;
                      }
                      s.open = true;
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] открытие окна (finishOpen)", e);
                      cleanup(s);
                      p.sendMessage("§cОшибка рынка. Сообщи администратору.");
                  }
              }

              private void sendFake(Player p, Level lv, int x, int y, int z) throws Exception {
                  Block b = Block.get(Block.CHEST, 2);
                  b.x = x;
                  b.y = y;
                  b.z = z;
                  b.level = lv;
                  lv.sendBlocks(new Player[]{p}, new Vector3[]{b});

                  CompoundTag tag = new CompoundTag()
                          .putString("id", "Chest")
                          .putInt("x", x)
                          .putInt("y", y)
                          .putInt("z", z)
                          .putString("CustomName", TITLE);
                  BlockEntityDataPacket pk = new BlockEntityDataPacket();
                  pk.x = x;
                  pk.y = y;
                  pk.z = z;
                  pk.namedTag = NBTIO.write(tag, ByteOrder.LITTLE_ENDIAN, true);
                  p.dataPacket(pk);
              }

              private void restoreBlock(Session s) {
                  try {
                      if (s.player.isOnline() && s.player.getLevel() == s.level) {
                          s.level.sendBlocks(new Player[]{s.player}, new Vector3[]{new Vector3(s.x, s.y, s.z)});
                      }
                  } catch (Exception ignored) {
                      // игрок мог выйти
                  }
              }

              /** Идемпотентная уборка сессии: убирает запись и возвращает настоящий блок. */
              private void cleanup(Session s) {
                  if (!sessions.remove(s.player.getUniqueId(), s)) {
                      return;
                  }
                  s.open = false;
                  restoreBlock(s);
              }

              private void closeChest(Session s) {
                  try {
                      if (s.inv != null && s.player.isOnline()) {
                          s.player.removeWindow(s.inv);
                      }
                  } catch (Exception ignored) {
                      // игрок мог выйти
                  }
                  cleanup(s);
              }

              public void closeAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      closeChest(s);
                  }
                  pending.clear();
              }

              /** Перерисовать открытые сундуки (лот купили / выставили / сняли). */
              public void refreshAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      if (s.open && s.player.isOnline()) {
                          render(s);
                      }
                  }
              }

              // ================= отрисовка сундука =================

              private List<Lot> filtered(Player p, State st) {
                  String uid = p.getUniqueId().toString();
                  String q = RuNames.norm(st.search);
                  List<Lot> out = new ArrayList<>();
                  for (Lot l : plugin.lots) {
                      if (st.mine && !uid.equals(l.seller)) {
                          continue;
                      }
                      if (!q.isEmpty()) {
                          Item li = l.toItem();
                          if (!RuNames.norm(RuNames.of(li)).contains(q) && !RuNames.norm(li.getName()).contains(q)) {
                              continue;
                          }
                      }
                      out.add(l);
                  }
                  out.sort((a, b) -> Long.compare(b.created, a.created));
                  return out;
              }

              private void render(Session s) {
                  if (s.inv == null) {
                      return;
                  }
                  try {
                      Player p = s.player;
                      State st = state(p);
                      List<Lot> list = filtered(p, st);
                      int pages = Math.max(1, (list.size() + PAGE - 1) / PAGE);
                      if (st.page >= pages) {
                          st.page = pages - 1;
                      }
                      if (st.page < 0) {
                          st.page = 0;
                      }
                      String uid = p.getUniqueId().toString();
                      Map<Integer, Item> m = new HashMap<>();
                      Map<Integer, String> act = new HashMap<>();

                      int from = st.page * PAGE;
                      for (int i = 0; i < PAGE && from + i < list.size(); i++) {
                          Lot l = list.get(from + i);
                          m.put(i, lotIcon(l, uid.equals(l.seller)));
                          act.put(i, "lot:" + l.id);
                      }
                      if (list.isEmpty()) {
                          String[] hint = st.mine
                                  ? new String[]{"§fВозьми предмет в руку", "§fи напиши §e/sell <цена>"}
                                  : new String[]{"§fПопробуй другой запрос", "§fили выставь свой лот: §e/sell <цена>"};
                          m.put(4, ui(mk("paper", "paper"), "§cЛотов не найдено", hint));
                      }

                      m.put(S_SEARCH, ui(mk("compass", "paper"), "§bПоиск по названию",
                              st.search.isEmpty() ? new String[]{"§fНажми и введи название"} : new String[]{"§fСейчас ищем: §e" + st.search}));
                      act.put(S_SEARCH, "search");

                      m.put(S_MODE, ui(mk("chest", "paper"), st.mine ? "§eПоказать все лоты" : "§aПоказать мои лоты",
                              "§fСейчас: §e" + (st.mine ? "мои лоты" : "все лоты")));
                      act.put(S_MODE, "mode");

                      if (!st.search.isEmpty()) {
                          m.put(S_RESET, ui(mk("redstone_torch", "redstone"), "§cСбросить поиск", "§fСейчас ищем: §e" + st.search));
                          act.put(S_RESET, "reset");
                      }

                      if (pages > 1) {
                          if (st.page > 0) {
                              m.put(S_PREV, ui(mk("arrow", "paper"), "§e« Предыдущая страница", "§fСтраница " + (st.page + 1) + " из " + pages));
                              act.put(S_PREV, "prev");
                          }
                          if (st.page < pages - 1) {
                              m.put(S_NEXT, ui(mk("arrow", "paper"), "§eСледующая страница »", "§fСтраница " + (st.page + 1) + " из " + pages));
                              act.put(S_NEXT, "next");
                          }
                      }
                      m.put(S_BACK, ui(mk("barrier", "arrow"), "§cК меню",
                              "§fСтраница: §e" + (st.page + 1) + " §fиз §e" + pages, "§fЛотов в списке: §e" + list.size()));
                      act.put(S_BACK, "back");

                      m.put(S_STATS, ui(mk("book", "paper"), "§6Статистика", "§fТвои продажи и лимиты"));
                      act.put(S_STATS, "stats");

                      m.put(S_BAL, ui(mk("gold_nugget", "gold_ingot"), "§eБаланс: §f" + bal(p) + " монет",
                              "§fТвоих лотов: §e" + plugin.countLots(p.getUniqueId()) + "§f из §e" + plugin.maxLots,
                              "§fВсего на рынке: §e" + plugin.lots.size()));

                      s.actions = act;
                      s.inv.setContents(m);
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] отрисовка меню (render)", e);
                  }
              }

              private Item lotIcon(Lot l, boolean own) {
                  Item base = l.toItem();
                  String name = RuNames.of(base);
                  if (name.indexOf('§') < 0) {
                      name = "§f" + name;
                  }
                  List<String> lore = new ArrayList<>();
                  try {
                      String[] old = base.getLore();
                      if (old != null) {
                          for (String line : old) {
                              lore.add(line);
                          }
                      }
                  } catch (Throwable ignored) {
                      // нет метода в этой сборке
                  }
                  if (!lore.isEmpty()) {
                      lore.add("§r ");
                  }
                  lore.add("§eЦена: §a" + l.price + " монет");
                  lore.add("§bПродавец: §f" + l.sellerName);
                  if (own) {
                      lore.add("§6Это твой лот");
                      lore.add("§cНажми, чтобы снять с продажи");
                  } else {
                      lore.add("§aНажми, чтобы посмотреть и купить");
                  }
                  return ui(base, name, lore.toArray(new String[0]));
              }

              private static Item ui(Item base, String name, String... lore) {
                  Item r = base.clone();
                  r.setCustomName(name);
                  if (lore != null && lore.length > 0) {
                      r.setLore(lore);
                  }
                  return r;
              }

              /** Предмет-кнопка по имени; если имя не распознано - запасной, а в крайнем случае бумага. */
              private static Item mk(String id, String fallback) {
                  Item it = safeItem(id);
                  if (it == null) {
                      it = safeItem(fallback);
                  }
                  if (it == null) {
                      it = Item.get(Item.PAPER);
                  }
                  return it;
              }

              private static Item safeItem(String id) {
                  try {
                      Item it = Item.fromString(id);
                      return it == null || it.getId() == 0 ? null : it;
                  } catch (Exception e) {
                      return null;
                  }
              }

              // ================= формы =================

              /** Команда /auc: главная форма с разделами. */
              public void open(Player p) {
                  openMain(p);
              }

              private void openMain(Player p) {
                  final State st = state(p);
                  String text = "§eБаланс: §a" + bal(p) + " монет"
                          + "\n§fЛотов на рынке: §e" + plugin.lots.size() + "§f, твоих: §e"
                          + plugin.countLots(p.getUniqueId()) + "§f из §e" + plugin.maxLots
                          + "\n\n§fВыбери раздел:";
                  FormWindowSimple form = new FormWindowSimple("§l§0Рынок", text);
                  form.addButton(btn("§l§0Все лоты§r\n§0Смотреть и покупать", "textures/blocks/chest_front"));
                  form.addButton(btn("§l§0Мои лоты§r\n§0Снять с продажи", "textures/items/name_tag"));
                  form.addButton(btn("§l§0Поиск§r\n§0По названию предмета", "textures/items/compass_item"));
                  form.addButton(btn("§l§0Статистика§r\n§0Продажи и лимиты", "textures/items/book_enchanted"));
                  form.addButton(btn("§l§0Как продать§r\n§0Команда /sell", "textures/items/gold_ingot"));
                  show(p, form, e -> {
                      int id = clickedId(e);
                      switch (id) {
                          case 0:
                              st.mine = false;
                              st.search = "";
                              st.page = 0;
                              openChest(p);
                              break;
                          case 1:
                              st.mine = true;
                              st.search = "";
                              st.page = 0;
                              openChest(p);
                              break;
                          case 2:
                              openSearch(p);
                              break;
                          case 3:
                              openStats(p);
                              break;
                          case 4:
                              openHelp(p);
                              break;
                          default:
                              break;
                      }
                  });
              }

              private void openSearch(Player p) {
                  final State st = state(p);
                  List<Element> el = new ArrayList<>();
                  el.add(new ElementInput("§fНазвание предмета", "например: алмазный меч"));
                  show(p, new FormWindowCustom("§l§0Поиск на рынке", el), e -> {
                      if (!e.wasClosed() && e.getResponse() instanceof FormResponseCustom) {
                          String in = ((FormResponseCustom) e.getResponse()).getInputResponse(0);
                          st.search = in == null ? "" : in.trim();
                          st.page = 0;
                      }
                      openChest(p);
                  });
              }

              private void openLot(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      reopen(p);
                      return;
                  }
                  final boolean own = p.getUniqueId().toString().equals(lot.seller);
                  Item it = lot.toItem();
                  long fee = lot.price * plugin.commission / 100L;
                  StringBuilder sb = new StringBuilder();
                  sb.append("§eПредмет: §b").append(RuNames.plain(it));
                  if (it.getCount() > 1) {
                      sb.append(" §fx").append(it.getCount());
                  }
                  Enchantment[] en = it.getEnchantments();
                  if (en != null && en.length > 0) {
                      sb.append("\n§eЧары: §d").append(Enchants.plain(en));
                  }
                  sb.append("\n§eЦена: §a").append(lot.price).append(" монет");
                  sb.append("\n§eПродавец: §f").append(lot.sellerName);
                  if (own) {
                      sb.append("\n\n§fПосле продажи ты получишь: §a").append(lot.price - fee)
                              .append("§f монет (комиссия ").append(plugin.commission).append("%)");
                  } else {
                      sb.append("\n\n§fКомиссия ").append(plugin.commission).append("% берётся с продавца");
                      sb.append("\n§fТвой баланс: §a").append(bal(p)).append("§f монет");
                  }

                  FormWindowSimple form = new FormWindowSimple("§l§0Лот", sb.toString());
                  form.addButton(new ElementButton(own ? "§4§lСнять с продажи" : "§2§lКупить за " + lot.price + " монет"));
                  form.addButton(new ElementButton("§0§l◀ К списку"));

                  final long lotId = id;
                  show(p, form, e -> {
                      int c = clickedId(e);
                      if (c == 0) {
                          if (own) {
                              withdrawOwn(p, lotId);
                          } else {
                              Lot cur = plugin.findLot(lotId);
                              if (cur != null && cur.price > plugin.confirmAbove) {
                                  openConfirm(p, lotId);
                              } else {
                                  purchase(p, lotId);
                              }
                          }
                      } else {
                          reopen(p);
                      }
                  });
              }

              private void openConfirm(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      reopen(p);
                      return;
                  }
                  FormWindowModal form = new FormWindowModal("§l§0Подтверждение покупки",
                          "§fКупить §b" + nameOf(lot) + "§f за §a" + lot.price + " монет§f?\n§fПродавец: §e" + lot.sellerName,
                          "§2§lКупить", "§4§lОтмена");
                  show(p, form, e -> {
                      boolean yes = false;
                      if (!e.wasClosed() && e.getResponse() instanceof FormResponseModal) {
                          yes = ((FormResponseModal) e.getResponse()).getClickedButtonId() == 0;
                      }
                      if (yes) {
                          purchase(p, id);
                      } else {
                          p.sendMessage("§fПокупка отменена");
                          reopen(p);
                      }
                  });
              }

              private void openStats(Player p) {
                  String uid = p.getUniqueId().toString();
                  String text = "§eПродано на сумму: §a" + plugin.sold.getOrDefault(uid, 0L)
                          + "\n§eТвоих лотов: §f" + plugin.countLots(p.getUniqueId()) + "§f из " + plugin.maxLots
                          + "\n§eВсего лотов на рынке: §f" + plugin.lots.size()
                          + "\n§eТвой баланс: §a" + bal(p) + " монет";
                  FormWindowSimple form = new FormWindowSimple("§l§0Статистика", text);
                  form.addButton(new ElementButton("§0§l◀ К меню"));
                  show(p, form, e -> openMain(p));
              }

              private void openHelp(Player p) {
                  String text = "§eЧтобы выставить предмет на рынок:"
                          + "\n§f1. Возьми предмет в руку"
                          + "\n§f2. Напиши §a/sell <цена>"
                          + "\n\n§fПример: §a/sell 500"
                          + "\n\n§fМаксимальная цена: §e" + plugin.maxPrice + "§f монет"
                          + "\n§fКомиссия: §e" + plugin.commission + "%§f (берётся с продавца)"
                          + "\n§fМаксимум лотов у игрока: §e" + plugin.maxLots;
                  FormWindowSimple form = new FormWindowSimple("§l§0Как продать", text);
                  form.addButton(new ElementButton("§0§l◀ К меню"));
                  show(p, form, e -> openMain(p));
              }

              // ================= действия =================

              private void withdrawOwn(Player p, long id) {
                  Lot lot = plugin.findLot(id);
                  if (lot == null || !p.getUniqueId().toString().equals(lot.seller)) {
                      p.sendMessage("§cЛот уже продан или снят");
                      reopen(p);
                      return;
                  }
                  Item item = lot.toItem();
                  if (!p.getInventory().canAddItem(item)) {
                      p.sendMessage("§cУ вас нет места в инвентаре!");
                      reopen(p);
                      return;
                  }
                  plugin.lots.remove(lot);
                  p.getInventory().addItem(item);
                  plugin.saveData();
                  p.sendMessage("§aЛот снят с продажи, предмет возвращён");
                  plugin.refreshAll();
                  reopen(p);
              }

              private void purchase(Player p, long id) {
                  try {
                      purchaseInner(p, id);
                  } catch (Exception e) {
                      plugin.getLogger().error("[Auction] ошибка, этап: оплата", e);
                      p.sendMessage("§cОшибка рынка (оплата). Сообщи администратору.");
                  }
                  reopen(p);
              }

              private void purchaseInner(Player p, long id) throws Exception {
                  String uid = p.getUniqueId().toString();
                  Lot lot = plugin.findLot(id);
                  if (lot == null) {
                      p.sendMessage("§cЛот уже продан или снят");
                      return;
                  }
                  if (uid.equals(lot.seller)) {
                      return;
                  }
                  Economy eco = plugin.economy;
                  eco.ensureAccount(p);
                  String buyer = p.getName();
                  long price = lot.price;
                  long bal = eco.getBalance(buyer);
                  if (bal < price) {
                      p.sendMessage("§cНедостаточно монет! Нужно §e" + price + "§c, у вас §e" + bal);
                      return;
                  }
                  Item item = lot.toItem();
                  if (!p.getInventory().canAddItem(item)) {
                      p.sendMessage("§cУ вас нет места в инвентаре!");
                      return;
                  }
                  long fee = price * plugin.commission / 100L;
                  long payout = price - fee;
                  if (payout > 0 && !eco.canReceive(lot.sellerName, payout)) {
                      p.sendMessage("§cПродавец сейчас не может получить оплату (нет аккаунта или переполнен баланс)");
                      return;
                  }
                  if (!eco.take(buyer, price)) {
                      p.sendMessage("§cНе удалось снять монеты");
                      return;
                  }
                  if (payout > 0 && !eco.add(lot.sellerName, payout)) {
                      eco.add(buyer, price);
                      p.sendMessage("§cОшибка оплаты, монеты возвращены");
                      return;
                  }
                  plugin.lots.remove(lot);
                  plugin.sold.merge(lot.seller, price, Long::sum);
                  p.getInventory().addItem(item);
                  plugin.saveData();

                  String nm = RuNames.of(item) + (item.getCount() > 1 ? " §fx" + item.getCount() : "");
                  p.sendMessage("§aВы купили §f" + nm + " §aза §e" + price + "§a. Баланс: §e" + eco.getBalance(buyer));
                  try {
                      Player sp = plugin.getServer().getOnlinePlayers().get(UUID.fromString(lot.seller));
                      if (sp != null && sp.isOnline()) {
                          sp.sendMessage("§aВаш лот §f" + nm + " §aкуплен игроком §f" + buyer
                                  + "§a. Получено: §e" + payout + " §f(комиссия " + fee + ")");
                      }
                  } catch (Exception ignored) {
                      // продавец не в сети
                  }
                  plugin.refreshAll();
              }
          }
