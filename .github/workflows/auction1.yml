          /**
           * Меню рынка: главная форма -> сундук со списком лотов (как в /shop) -> форма лота / подтверждения.
           * Сундук подставляется игроку пакетом (реального блока в мире нет), при закрытии настоящий блок восстанавливается.
           * Текст в формах тёмный (читается на светлом фоне), в сундуке (тёмные подсказки) - светлый.
           */
          public class AuctionMenu implements Listener {
              private static final int PAGE = 18;
              private static final String TITLE = "§lРынок";

              private static final int S_SEARCH = 18;
              private static final int S_MODE = 19;
              private static final int S_RESET = 20;
              private static final int S_PREV = 21;
              private static final int S_BACK = 22;
              private static final int S_NEXT = 23;
              private static final int S_STATS = 24;
              private static final int S_BAL = 26;

              private static final class State {
                  boolean mine = false;
                  String search = "";
                  int page = 0;
              }

              private static final class Pending {
                  final int formId;
                  final Consumer<PlayerFormRespondedEvent> handler;

                  Pending(int formId, Consumer<PlayerFormRespondedEvent> handler) {
                      this.formId = formId;
                      this.handler = handler;
                  }
              }

              /** Холдер фейкового сундука: просто точка, откуда клиент берёт позицию контейнера. */
              private static final class Holder extends Vector3 implements InventoryHolder {
                  Inventory inv;

                  Holder(int x, int y, int z) {
                      super(x, y, z);
                  }

                  @Override
                  public Inventory getInventory() {
                      return inv;
                  }
              }

              private static final class ChestMenu extends ContainerInventory {
                  ChestMenu(Holder holder) {
                      super(holder, InventoryType.CHEST);
                      holder.inv = this;
                  }
              }

              private static final class Session {
                  final Player player;
                  final Level level;
                  final int x;
                  final int y;
                  final int z;
                  final long created = System.currentTimeMillis();
                  ChestMenu inv;
                  boolean open;
                  long last;
                  Map<Integer, String> actions = new HashMap<>();

                  Session(Player player, Level level, int x, int y, int z) {
