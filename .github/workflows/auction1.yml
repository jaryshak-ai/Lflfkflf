name: Build Auction (forms + chest, RU)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать исходники плагина
        run: |
          set -e
          mkdir -p Auction/src/main/java/auction/economy Auction/src/main/resources
          cat > Auction/pom.xml << 'EOF_0'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>auction</groupId>
              <artifactId>Auction</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>Auction</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF_0
          cat > Auction/src/main/resources/plugin.yml << 'EOF_1'
          name: Auction
          main: auction.AuctionPlugin
          version: 1.3.0
          api: ["1.0.0"]
          author: server
          description: "Рынок (аукцион) - главное меню на формах, лоты в меню-сундуке"
          depend: [TpCoins]
          commands:
            sell:
              description: Выставить предмет из руки на рынок
              usage: /sell <цена>
              permission: auction.use
            auc:
              description: Открыть рынок
              usage: /auc
              aliases: [ah]
              permission: auction.use
            bal:
              description: Посмотреть свой баланс
              usage: /bal
              aliases: [balance]
              permission: auction.use
          permissions:
            auction.use:
              default: true
          EOF_1
          cat > Auction/src/main/resources/config.yml << 'EOF_2'
          # Комиссия рынка в процентах (удерживается с продавца)
          commission-percent: 3
          # Максимум лотов у одного игрока
          max-lots-per-player: 10
          # Максимальная цена в /sell
          max-price: 300000
          # Если цена выше этой суммы, покупка требует подтверждения
          confirm-above: 50000
